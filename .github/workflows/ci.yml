name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Biome — lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome CI
        run: pnpm ci:check

  typecheck:
    name: TypeScript — type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: pnpm typecheck

  test:
    name: Tests — unit & integration
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      # Provide stub values so env.ts doesn't throw during test imports.
      # No real DB is used — services are mocked.
      DATABASE_URL: postgres://test:test@localhost:5432/test
      JWT_SECRET: test-jwt-secret-min-32-chars-long!!
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars!!
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  docker-build:
    name: Docker — build API image
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ironquill-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: Build — all packages
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # shared exports raw TS — no build step needed
      - name: Build API
        run: pnpm --filter @ironquill/api build

      - name: Build web
        run: pnpm --filter @ironquill/web build

  # ── Gate ──────────────────────────────────────────────────────────────────
  # Single required status check for branch protection.
  # Add "CI / ci-gate" as the only required check in:
  #   GitHub → Settings → Branches → main → Require status checks to pass
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, docker-build, build]
    if: always()
    steps:
      - name: All jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed."
